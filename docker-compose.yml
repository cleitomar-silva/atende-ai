services:
  db:
    image: postgres:16-alpine
    container_name: atendeai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atendeai}
      POSTGRES_USER: ${POSTGRES_USER:-atendeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atendeai}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atendeai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: atendeai-backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-atendeai}
      DB_USERNAME: ${POSTGRES_USER:-atendeai}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-atendeai}

  frontend:
    build: ./frontend
    container_name: atendeai-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
